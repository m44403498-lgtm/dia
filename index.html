];

const container = document.getElementById('quiz-container');
document.getElementById('total-q').textContent = mcqData.length;

// Shuffle options of 3-choice questions so the correct answer isn't predictable
mcqData.forEach(item => {
   if (item.options.length < 3) return;
   const correctText = item.options[item.ans];
   for (let i = item.options.length - 1; i > 0; i--) {
       const j = Math.floor(Math.random() * (i + 1));
       [item.options[i], item.options[j]] = [item.options[j], item.options[i]];
   }
   item.ans = item.options.indexOf(correctText);
});
let correctCount = 0;
let wrongCount = 0;
const labels = ['a', 'b', 'c'];

mcqData.forEach((item, index) => {
   const card = document.createElement('div');
   card.className = 'question-card';

   const qText = document.createElement('div');
   qText.className = 'question-text';
   qText.textContent = `${index + 1}. ${item.q}`;
   card.appendChild(qText);

   const selectOne = document.createElement('div');
   selectOne.className = 'select-one';
   selectOne.textContent = 'Select one:';
   card.appendChild(selectOne);

   const optionsContainer = document.createElement('div');
   optionsContainer.className = 'options';

   item.options.forEach((optText, optIndex) => {
       const optDiv = document.createElement('div');
       optDiv.className = 'option';
       
       const labelSpan = document.createElement('span');
       labelSpan.className = 'option-label';
       labelSpan.textContent = `${labels[optIndex]}.`;

       const textSpan = document.createElement('span');
       textSpan.textContent = optText;

       optDiv.appendChild(labelSpan);
       optDiv.appendChild(textSpan);

       optDiv.addEventListener('click', function() {
           if (optionsContainer.classList.contains('answered')) return;
           optionsContainer.classList.add('answered');

           const allOpts = optionsContainer.querySelectorAll('.option');
           allOpts.forEach(o => o.classList.add('disabled'));

           if (optIndex === item.ans) {
               this.classList.add('correct');
               correctCount++;
               document.getElementById('correct-count').textContent = correctCount;
           } else {
               this.classList.add('incorrect');
               allOpts[item.ans].classList.add('correct');
               wrongCount++;
               document.getElementById('wrong-count').textContent = wrongCount;
           }
       });

       optionsContainer.appendChild(optDiv);
   });

   card.appendChild(optionsContainer);
   container.appendChild(card);
});
</script>
