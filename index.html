            { id: 297, q: "يَسْتَغْفِرُونَ کا مطلب ہے:", o: ["وہ گناہ کرتے ہیں", "وہ استغفار کرتے ہیں", "وہ جانتے ہیں"], a: "وہ استغفار کرتے ہیں" },
            { id: 298, q: "يَتُوبُونَ کا مطلب ہے:", o: ["وہ توبہ کرتے ہیں", "وہ گناہ کرتے ہیں", "وہ جانتے ہیں"], a: "وہ توبہ کرتے ہیں" },
            { id: 299, q: "يُسَبِّحُونَ کا مطلب ہے:", o: ["وہ تسبیح کرتے ہیں", "وہ غافل ہوتے ہیں", "وہ جانتے ہیں"], a: "وہ تسبیح کرتے ہیں" },
            { id: 300, q: "يُقَدِّسُونَ کا مطلب ہے:", o: ["وہ پاک کرتے ہیں", "وہ ناپاک کرتے ہیں", "وہ جانتے ہیں"], a: "وہ پاک کرتے ہیں" }
        ];

        let score = 0;
        const container = document.getElementById('quiz-container');
        const scoreDisplay = document.getElementById('score');
        const totalDisplay = document.getElementById('total');

        totalDisplay.textContent = quizData.length;

        function renderQuiz() {
            let html = '';
            quizData.forEach((q, index) => {
                // Insert Section Header
                if (q.id === 1) {
                    html += `<div class="section-header">📘 یونٹ 5 — 300 MCQs</div>`;
                }

                html += `<div class="mcq" id="q${q.id}">`;
                html += `<div class="question-text">سوال ${q.id}: ${q.q}</div>`;
                
                q.o.forEach((option, optIndex) => {
                    const letter = String.fromCharCode(65 + optIndex); // A, B, C
                    html += `<div class="option" onclick="checkAnswer(this, '${q.a}', '${option}')">${letter}) ${option}</div>`;
                });
                
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function checkAnswer(element, correctAnswer, selectedOption) {
            const parent = element.parentElement;
            
            if (parent.classList.contains('answered')) {
                return;
            }
            parent.classList.add('answered');

            const options = parent.querySelectorAll('.option');
            options.forEach(opt => {
                const optText = opt.textContent.substring(3); // Remove "A) "
                if (optText === correctAnswer) {
                    opt.classList.add('correct');
                }
            });

            if (selectedOption !== correctAnswer) {
                element.classList.add('incorrect');
            } else {
                score++;
                scoreDisplay.textContent = score;
            }
        }

        renderQuiz();
    </script>
</body>
</html>
