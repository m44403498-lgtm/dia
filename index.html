    // Function to shuffle an array (Fisher-Yates)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const container = document.getElementById('quiz-container');

    mcqData.forEach((item, index) => {
        // Create card
        const card = document.createElement('div');
        card.className = 'question-card';

        // Create question text
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = `${index + 1}. ${item.q}`;
        card.appendChild(qText);

        // Create options container
        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'options';

        // Randomize options
        const shuffledOptions = shuffleArray([...item.options]);

        shuffledOptions.forEach(option => {
            const optDiv = document.createElement('div');
            optDiv.className = 'option';
            optDiv.textContent = option;

            // Add click event
            optDiv.addEventListener('click', function() {
                // If already answered, ignore
                if (this.parentElement.classList.contains('answered')) return;
                
                // Mark container as answered
                this.parentElement.classList.add('answered');
                
                // Disable all options in this question
                const allOptions = this.parentElement.querySelectorAll('.option');
                allOptions.forEach(opt => opt.classList.add('disabled'));

                // Check if correct
                if (this.textContent === item.correct) {
                    this.classList.add('correct');
                } else {
                    this.classList.add('incorrect');
                    // Highlight the correct answer
                    allOptions.forEach(opt => {
                        if (opt.textContent === item.correct) {
                            opt.classList.add('correct');
                        }
                    });
                }
            });

            optionsContainer.appendChild(optDiv);
        });

        card.appendChild(optionsContainer);
        container.appendChild(card);
    });
